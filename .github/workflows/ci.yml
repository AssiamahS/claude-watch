name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS + watchOS (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/ClaudeWatch/project.yml --project ios/ClaudeWatch

      - name: Build iOS app + embedded watch app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/ClaudeWatch/ClaudeWatch.xcodeproj \
            -scheme ClaudeWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  testflight:
    name: Sign & upload to TestFlight
    # apple requires the ios 26 sdk for app store connect uploads
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check for App Store Connect credentials
        id: creds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC secrets not set — skipping TestFlight upload"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write App Store Connect API key
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          # xcodebuild's upload phase only searches the standard private_keys dirs
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install XcodeGen
        if: steps.creds.outputs.have == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.creds.outputs.have == 'true'
        run: |
          # Stamp the run number BEFORE generating — the plists resolve
          # $(CURRENT_PROJECT_VERSION) from this setting.
          sed -i '' "s/^    CURRENT_PROJECT_VERSION: .*/    CURRENT_PROJECT_VERSION: $GITHUB_RUN_NUMBER/" ios/ClaudeWatch/project.yml
          xcodegen generate --spec ios/ClaudeWatch/project.yml --project ios/ClaudeWatch

      - name: Archive (cloud-managed signing)
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/ClaudeWatch/ClaudeWatch.xcodeproj \
            -scheme ClaudeWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClaudeWatch.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER

      - name: Export & upload to App Store Connect
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/ClaudeWatch.xcarchive \
            -exportOptionsPlist ios/ClaudeWatch/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
